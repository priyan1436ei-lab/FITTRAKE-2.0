name: Windows package and unit tests
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tools
        run: python -m pip install -e ".[dev]"
      - name: Test deterministic engine
        run: python -m pytest -q
      - name: Freeze executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name TRACEBACK-WiFi --paths src src/traceback_wifi/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: TRACEBACK-WiFi-Windows
          path: dist/TRACEBACK-WiFi/
          if-no-files-found: error
