[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceback-wifi"
version = "0.1.0"
description = "Evidence-first Wi-Fi incident investigation for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15", "numpy>=1.26,<3"]
license = "MIT"
authors = [{name = "TRACEBACK WiFi Contributors"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pyinstaller>=6,<7"]

[project.scripts]
traceback-wifi = "traceback_wifi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
